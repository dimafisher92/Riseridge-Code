name: prospect pipeline

# Polls #sales-pipeline for new bookings and produces the three artefacts.
#
# Polling rather than a webhook: a webhook needs a public endpoint to receive
# Slack's callback, and there isn't one. The bot already has channels:history,
# so reading on a schedule needs no new infrastructure and no inbound surface.
#
# Windows, not Linux, for the same reason as tests.yml: the PDF renderer shells
# out to Chrome and Chrome is preinstalled on the Windows image.

on:
  schedule:
    # Hourly on the hour, UTC. Booking volume is roughly one a week, so this is
    # about latency to the call, not throughput.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      post:
        description: "Write to the prospect's Slack thread (otherwise dry run)"
        type: boolean
        default: false
      apply:
        description: "Allow creating a Site Explorer project (paid quota)"
        type: boolean
        default: false
      max_age_hours:
        description: "Only bookings newer than this (0 disables the cutoff)"
        default: "48"

concurrency:
  # Two overlapping runs could each pass the already-posted check before either
  # writes, and double-post into a prospect's thread.
  group: prospect-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run the pipeline
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SALES_PIPELINE_CHANNEL: ${{ secrets.SALES_PIPELINE_CHANNEL }}
          SLACK_BOT_USER_ID: ${{ secrets.SLACK_BOT_USER_ID }}
          SEARCHATLAS_API_KEY: ${{ secrets.SEARCHATLAS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Until posting is armed, artefacts are delivered to this internal
          # Slack channel. They cannot be delivered as a build artifact or in
          # the job log: this repository is PUBLIC, and both are world-readable
          # there. Prospect names, emails and domains must never reach either.
          RR_REVIEW_CHANNEL: ${{ secrets.RR_REVIEW_CHANNEL }}
          # Posting to a prospect thread needs BOTH this and --post. Scheduled
          # runs never pass --post, so setting this alone still writes nothing:
          # the bot cannot start posting because a secret was added by accident.
          RR_POSTING_ARMED: ${{ secrets.RR_POSTING_ARMED }}
        shell: bash
        run: |
          set -euo pipefail
          ARGS="--max-age-hours ${{ github.event.inputs.max_age_hours || '48' }}"
          if [ "${{ github.event.inputs.post }}" = "true" ]; then ARGS="$ARGS --post"; fi
          if [ "${{ github.event.inputs.apply }}" = "true" ]; then ARGS="$ARGS --apply"; fi
          echo "run_pipeline.py $ARGS"
          # No --reveal: the run log is redacted, because this log is public.
          python run_pipeline.py $ARGS

      # Deliberately NO artifact upload. state/prospects/ holds real prospect
      # names, emails, domains and their audit PDFs. Artifacts on a public
      # repository are downloadable by anyone with the run URL, so the
      # artefacts leave this runner through Slack or not at all. If this
      # repository is ever made private, an upload step can be reconsidered.
