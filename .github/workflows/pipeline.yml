name: prospect pipeline

# Polls #sales-pipeline for new bookings and produces the three artefacts.
#
# Polling rather than a webhook: a webhook needs a public endpoint to receive
# Slack's callback, and there isn't one. The bot already has channels:history,
# so reading on a schedule needs no new infrastructure and no inbound surface.
#
# Ubuntu, unlike tests.yml. tests.yml uses Windows so the PDF tests exercise the
# operator's real Chrome path rather than skipping. This job has a different
# constraint: it must actually get a runner. A scheduled windows-latest job was
# cancelled after waiting 15 minutes unassigned, and Linux runners are far more
# plentiful. The renderer is portable via RR_CHROME, which is resolved below.

on:
  schedule:
    # Hourly at :37, NOT on the hour. The 16:00 run waited 15 minutes for a
    # runner and was cancelled without ever starting: the top of the hour is
    # when every cron on the platform fires at once. An off-peak minute is the
    # documented mitigation, and booking volume (roughly one a week) means the
    # exact minute is irrelevant to latency.
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      post:
        description: "Deliver artefacts into the lead's thread (otherwise dry run)"
        type: boolean
        default: false
      apply:
        description: "Allow creating a Site Explorer project (paid quota). Scheduled runs always do."
        type: boolean
        default: false
      max_age_hours:
        description: "Only bookings newer than this (0 disables the cutoff)"
        default: "48"
      force_repost:
        description: "Re-post even if already delivered (leaves both copies)"
        type: boolean
        default: false

concurrency:
  # Two overlapping runs could each pass the already-posted check before either
  # writes, and double-post into a prospect's thread.
  group: prospect-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Was 60. A hung run burned 45 minutes and produced no logs before the
    # runner died; there is no healthy path anywhere near this long, so
    # fail fast and leave a diagnosable trail instead.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Locate Chrome for the PDF renderer
        shell: bash
        run: |
          set -euo pipefail
          # Fail loudly here rather than letting every render fail its embed
          # gate one by one further down.
          for c in google-chrome google-chrome-stable chromium-browser chromium; do
            if command -v "$c" >/dev/null 2>&1; then
              echo "RR_CHROME=$(command -v $c)" >> "$GITHUB_ENV"
              # Chrome refuses to run as root without this on a CI container.
              echo "RR_CHROME_FLAGS=--no-sandbox --disable-dev-shm-usage" >> "$GITHUB_ENV"
              echo "using $(command -v $c)"
              exit 0
            fi
          done
          echo "No Chrome binary found; the audit PDF cannot be rendered." >&2
          exit 1

      - name: Run the pipeline
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SALES_PIPELINE_CHANNEL: ${{ secrets.SALES_PIPELINE_CHANNEL }}
          SLACK_BOT_USER_ID: ${{ secrets.SLACK_BOT_USER_ID }}
          SEARCHATLAS_API_KEY: ${{ secrets.SEARCHATLAS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # No RR_POSTING_ARMED here on purpose. That switch guards a channel
          # the prospect can see; #sales-pipeline is private and internal, so
          # requiring it would guard against nothing. Delivery is controlled by
          # --post alone, below.
          #
          # Artefacts reach the closer through Slack or not at all: this
          # repository is PUBLIC, so the job log and any build artifact are
          # world-readable and must never carry prospect data.
        shell: bash
        run: |
          set -euo pipefail
          ARGS="--max-age-hours ${{ github.event.inputs.max_age_hours || '48' }}"
          # Scheduled runs deliver. #sales-pipeline is internal, so the lead's
          # thread is where the closer reads these; a schedule that built the
          # artefacts and discarded them with the runner would be pointless.
          # A manual dispatch has to opt in, so a hand-run stays a dry run by
          # default.
          if [ "${{ github.event_name }}" = "schedule" ] \
             || [ "${{ github.event.inputs.post }}" = "true" ]; then
            ARGS="$ARGS --post"
          fi
          # Scheduled runs always create the Site Explorer project. The
          # operator authorised exactly this (2026-08-04: one project per
          # booked prospect), and without it traffic, authority, position
          # buckets and competitors are all warm-only and absent, which is
          # most of the report's credibility figures. collect.py bounds it:
          # one project per unique normalised domain, existing ones reused.
          # A manual dispatch has to opt in.
          if [ "${{ github.event_name }}" = "schedule" ] \
             || [ "${{ github.event.inputs.apply }}" = "true" ]; then
            ARGS="$ARGS --apply"
          fi
          # Never set by the schedule: it bypasses the only guard preventing a
          # duplicated thread, so it has to be a deliberate hand-run.
          if [ "${{ github.event.inputs.force_repost }}" = "true" ]; then
            ARGS="$ARGS --force-repost"
          fi
          echo "run_pipeline.py $ARGS"
          # No --reveal: the run log is redacted, because this log is public.
          python run_pipeline.py $ARGS

      # Deliberately NO artifact upload. state/prospects/ holds real prospect
      # names, emails, domains and their audit PDFs. Artifacts on a public
      # repository are downloadable by anyone with the run URL, so the
      # artefacts leave this runner through Slack or not at all. If this
      # repository is ever made private, an upload step can be reconsidered.
