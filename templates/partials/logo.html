<!-- RiseRidge monogram. Inline SVG on purpose: Chrome's --print-to-pdf does not
     embed an external <img src="*.svg">, so a linked logo renders blank in the
     PDF while looking correct on screen. The letterforms are real Cormorant
     Garamond glyphs -- the brand display face, already base64-embedded in the
     document -- so the mark stays vector and prints sharp at any size.

     Split of responsibility, and it matters: GEOMETRY (font-size, positions)
     lives in presentation attributes because those resolve in SVG user units,
     while CSS font-size on SVG text did not scale with the viewBox and rendered
     the letters at roughly half size. COLOUR lives in brand.css so one partial
     serves both the pine cover and the white pages -- hard-coded fills would put
     an ivory R on an ivory background on one of them. -->
<svg class="rr-mark" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="RiseRidge">
  <rect class="rr-frame" x="5" y="5" width="190" height="190"/>
  <!-- back R first, front R over it: the overlap is the mark -->
  <text class="rr-back" x="28" y="132" font-size="140"
        font-family="'Cormorant Garamond', serif" font-weight="600">R</text>
  <text class="rr-front" x="74" y="132" font-size="140"
        font-family="'Cormorant Garamond', serif" font-weight="600">R</text>
  <line class="rr-rule" x1="74" y1="152" x2="126" y2="152"/>
  <text class="rr-est" x="100" y="176" font-size="11" letter-spacing="5.5"
        text-anchor="middle" font-family="'Hanken Grotesk', Arial, sans-serif">EST · 2020</text>
</svg>
